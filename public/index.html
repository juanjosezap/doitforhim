<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do It For Her</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="poster-wrap" id="posterWrap">
      <img class="poster-img" id="posterImg" src="poster.png" alt="Do It For Her">

      <!-- Photo frames are injected here by app.js based on config -->
      <div id="framesContainer"></div>
    </div>

    <div class="no-media" id="noMedia">
      Drop photos &amp; videos into the <code>media/</code> folder, then refresh.
    </div>


  </div>

  <script src="app.js"></script>
</body>
</html>
